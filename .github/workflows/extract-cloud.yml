name: Extract NXT CLOUD app

on:
  push:
    paths:
      - "nxt-cloud.zip"
      - ".github/workflows/extract-cloud.yml"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract packaged app
        run: |
          rm -rf /tmp/nxt-cloud
          mkdir -p /tmp/nxt-cloud
          python - <<'PY'
          import zipfile
          from pathlib import Path
          z = zipfile.ZipFile("nxt-cloud.zip")
          z.extractall("/tmp/nxt-cloud")
          PY
          test -d /tmp/nxt-cloud/nxt-cloud
          cp -R /tmp/nxt-cloud/nxt-cloud/. .
          rm -rf /tmp/nxt-cloud

      - name: Commit extracted app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No extracted changes to commit."
            exit 0
          fi
          git commit -m "chore: extract packaged NXT CLOUD app"
          git push
